<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | utileria.js</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>Iniciar sesión</h1>
  <p class="sub">Correo y contraseña se validan con utileria.js.</p>
  <form id="login" novalidate>
    <label for="correo">Correo</label>
    <input id="correo" type="email" autocomplete="email"><span class="error" id="e-correo"></span>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password"><span class="error" id="e-password"></span>
    <div class="acciones">
      <button type="submit">Entrar</button>
      <a class="btn sec" href="index.html">Volver al registro</a>
    </div>
    <p class="aviso" id="resultado" role="status"></p>
  </form>
</main>
<script src="js/utileria.js"></script>
<script src="js/login.js"></script>
</body>
</html>
